<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <script src="js/bootstrap.min.js"> </script>
    <title>Productos</title>
</head>

<body class="bg-light">
    <div class="container py-4">
        <div class="mx-auto" style="max-width: 980px;">
            <nav class="navbar navbar-expand-lg bg-white border rounded-4 px-3 px-md-4 py-3">
                <div class="container-fluid px-0">
                    <a class="navbar-brand fw-bold fs-2" href="#">Brand</a>

                    <div class="collapse navbar-collapse" id="navbarNav">
                        <ul class="navbar-nav mx-auto gap-lg-3">
                            <li class="nav-item">
                                <a class="nav-link active " href="#">Inicio</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#">Productos</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#">Nosotros</a>
                            </li>
                        </ul>
                    </div>

                    <a class="btn btn-link p-0 text-dark fs-4" href="#" aria-label="Carrito">🛒</a>
                </div>
            </nav>

            <section class="bg-white rounded-4 p-4 p-md-5 mt-4">
                <h1 class="fw-bold mb-4">Nuestros productos</h1>

                <div class="d-flex align-items-center gap-3 mb-4">
                    <div class="input-group flex-grow-1">
                        <span class="input-group-text bg-transparent border-end-0">
                            🔍
                        </span>
                        <input class="form-control border-start-0" type="text" placeholder="Buscar productos..." aria-label="Buscar productos">
                    </div>
                    <button class="btn btn-light border rounded-3 px-4 py-2 text-dark">Filtrar</button>
                </div>

                <div class="row g-4">
                    <div class="col-12 col-md-6">
                        <div class="card h-100 border-0 rounded-4 bg-body-tertiary">
                            <img src="img/audifonos.jpeg" class="card-img-top rounded-top-4 p-4" alt="Audífonos inalámbricos" style="height: 260px; object-fit: contain;">
                            <div class="card-body px-4 pb-4 pt-2">
                                <h5 class="card-title fw-normal fs-4 mb-2">Audífonos Inalámbricos</h5>
                                <p class="card-text fs-5 mb-2">$59.99</p>
                                <div class="text-warning fs-5">★★★★★</div>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 col-md-6">
                        <div class="card h-100 border-0 rounded-4 bg-body-tertiary">
                            <img src="img/smartwatch.jpeg" class="card-img-top rounded-top-4 p-4" alt="Smartwatch Pro" style="height: 260px; object-fit: contain;">
                            <div class="card-body px-4 pb-4 pt-2">
                                <h5 class="card-title fw-normal fs-4 mb-2">Smartwatch Pro</h5>
                                <p class="card-text fs-5 mb-2">$89.99</p>
                                <div class="text-warning fs-5">★★★★★</div>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 col-md-6">
                        <div class="card h-100 border-0 rounded-4 bg-body-tertiary">
                            <img src="img/camara.jpeg" class="card-img-top rounded-top-4 p-4" alt="Cámara Digital" style="height: 260px; object-fit: contain;">
                            <div class="card-body px-4 pb-4 pt-2">
                                <h5 class="card-title fw-normal fs-4 mb-2">Cámara Digital</h5>
                                <p class="card-text fs-5 mb-2">$199.99</p>
                                <div class="text-warning fs-5">★★★★★</div>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 col-md-6">
                        <div class="card h-100 border-0 rounded-4 bg-body-tertiary">
                            <img src="img/mochila.jpeg" class="card-img-top rounded-top-4 p-4" alt="Mochila Urbana" style="height: 260px; object-fit: contain;">
                            <div class="card-body px-4 pb-4 pt-2">
                                <h5 class="card-title fw-normal fs-4 mb-2">Mochila Urbana</h5>
                                <p class="card-text fs-5 mb-2">$39.99</p>
                                <div class="text-warning fs-5">★★★★★</div>
                            </div>
                        </div>
                    </div>
                </div>

                <nav class="mt-4" aria-label="Page navigation">
                    <ul class="pagination justify-content-center mb-0">
                        <li class="page-item active"><a class="page-link" href="#">1</a></li>
                        <li class="page-item"><a class="page-link" href="#">2</a></li>
                        <li class="page-item"><a class="page-link" href="#">3</a></li>
                    </ul>
                </nav>
            </section>
        </div>
    </div>
</body>

</html>
